plugins { id 'base' }

// Collection happens only after the explicit verifier has passed both native lanes.
tasks.register('verifyDualNative', Exec) {
    workingDir projectDir
    commandLine 'python', file('tools/verify_dual_native.py')
}
tasks.register('test') { dependsOn 'verifyDualNative' }
tasks.named('build') { dependsOn 'verifyDualNative' }
