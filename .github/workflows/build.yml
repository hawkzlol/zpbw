name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify and build
        shell: bash
        run: |
          python -m unittest discover -s tools -p test_dual_native.py
          python tools/verify_dual_native.py
      - name: Show native build failure logs
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for log in sorted(Path('artifacts/build-runs').glob('*/mc*.log')):
              print(str(log))
              print(log.read_text(encoding='utf-8', errors='replace')[-16000:])
