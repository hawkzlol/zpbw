name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify and build
        shell: bash
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/verify_dual_native.py
      - name: Show native build failure logs
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for log in sorted(Path('artifacts/build-runs').glob('*/mc*.log')):
              print(str(log))
              print(log.read_text(encoding='utf-8', errors='replace')[-16000:])
          import hashlib, json, zipfile
          for jar in sorted(Path('versions').glob('*/.gradle/loom-cache/minecraftMaven/**/*.jar')):
              if 'minecraft-merged-' not in jar.name: continue
              with zipfile.ZipFile(jar) as z:
                  def content_digest(names):
                      return hashlib.sha256(''.join(n+' '+hashlib.sha256(z.read(n)).hexdigest()+'\n' for n in sorted(names)).encode()).hexdigest()
                  print('NATIVE_DERIVED_AUDIT '+json.dumps({'name':jar.name,'sha256':hashlib.sha256(jar.read_bytes()).hexdigest(),'entries':content_digest(z.namelist()),'classes':content_digest([n for n in z.namelist() if n.endswith('.class')]),'version':json.loads(z.read('version.json'))['id']}))
